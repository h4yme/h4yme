<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Jaimes Aldrich Manicar, Full Stack Engineer at CTRL">
<defs><style>
@font-face{font-family:"GP";src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"GM";src:url(data:font/woff2;base64,) format("woff2")}
.mono{font-family:"GM",ui-monospace,Menlo,Consolas,monospace}
.name{font-family:"GP","GM",ui-monospace,monospace;font-size:68px;fill:#09090b}
.art{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:7.9px;fill:#09090b}
.sweep{animation:s 7s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes s{from{transform:translateX(-300px)}to{transform:translateX(1280px)}}
@media (prefers-reduced-motion:reduce){.sweep{animation:none;transform:translateX(-300px)}}
</style>
